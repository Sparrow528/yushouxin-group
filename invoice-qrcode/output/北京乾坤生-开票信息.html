<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
<title>开票信息 - 北京乾坤生会计师事务所有限责任公司</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: #edf2f7;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}
.card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.06);
  max-width: 440px;
  width: 100%;
  overflow: hidden;
}
.top-bar {
  background: linear-gradient(135deg, #1e3a5f, #2a6496);
  padding: 28px 20px 20px;
  text-align: center;
}
.top-bar .icon { font-size: 36px; margin-bottom: 8px; }
.top-bar h1 {
  color: #fff; font-size: 18px; font-weight: 600; line-height: 1.5;
}
.top-bar .sub {
  color: rgba(255,255,255,0.65); font-size: 12px; margin-top: 6px; letter-spacing: 2px;
}
.content { padding: 24px 20px 28px; }
.row {
  display: flex; padding: 14px 0; border-bottom: 1px solid #f0f4f8;
}
.row:last-child { border-bottom: none; }
.label {
  flex: 0 0 78px; font-size: 13px; color: #8a9bb0; font-weight: 500; line-height: 1.6;
}
.value {
  flex: 1; font-size: 14px; color: #1a2a3a; line-height: 1.6; word-break: break-all;
}
.value.tax {
  font-size: 16px; font-weight: 700; color: #1e3a5f; letter-spacing: 1.5px;
}
.value.account {
  font-size: 15px; letter-spacing: 1px; font-weight: 600; color: #1e3a5f;
}
.hint {
  margin-top: 18px; text-align: center; font-size: 12px; color: #a0b0c0;
}
.footer {
  background: #f7f9fc; padding: 12px 20px; text-align: center;
  font-size: 11px; color: #b5c0cd;
}
</style>
</head>
<body>
<div class="card">
  <div class="top-bar">
    <div class="icon">🧾</div>
    <h1>北京乾坤生会计师事务所有限责任公司</h1>
    <div class="sub">开 票 信 息</div>
  </div>
  <div class="content">
    <div class="row"><div class="label">单位名称</div><div class="value">北京乾坤生会计师事务所有限责任公司</div></div>
    <div class="row"><div class="label">纳税人识别号</div><div class="value tax">91110105795101365D</div></div>
    <div class="row"><div class="label">地址</div><div class="value">北京市北京经济技术开发区(通州)环科中路16号25幢3层302-3</div></div>
    <div class="row"><div class="label">开户银行</div><div class="value">友利银行（中国）有限公司北京望京支行</div></div>
    <div class="row"><div class="label">银行账号</div><div class="value account">100201009372</div></div>
    <div class="hint">请将以上信息提供给开票方开具发票</div>
  </div>
  <div class="footer">长按识别二维码 · 保存开票信息</div>
</div>
</body>
</html>
